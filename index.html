<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EduFlow LMS</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Splash -->
  <div id="splash">
    <div class="splash-logo">E</div>
    <h1>EduFlow</h1>
    <p>Learning Management System</p>
    <div class="spinner"></div>
  </div>

  <!-- Login -->
  <div id="login-view" class="view">
    <div class="login-wrap">
      <div class="login-brand">
        <div class="splash-logo sm">E</div>
        <h1>EduFlow</h1>
        <p>Training provider LMS</p>
      </div>
      <form id="login-form" class="login-form">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control form-control-lg mb-3" required placeholder="you@example.com" value="trainer@eduflow.test">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control form-control-lg mb-3" required placeholder="Password" value="trainer123">
        <div id="login-error" class="alert alert-danger d-none py-2"></div>
        <button type="submit" class="btn btn-primary btn-lg w-100">Sign in</button>
      </form>
      <div class="demo-box">
        <strong>Demo accounts</strong>
        <div>Trainer: trainer@eduflow.test / trainer123</div>
        <div>Learner: learner1@eduflow.test / learner123</div>
      </div>
    </div>
  </div>

  <!-- App shell -->
  <div id="app-view" class="view d-none">
    <header class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn btn-sm btn-outline-light d-none" id="btn-back"><i class="bi bi-arrow-left"></i></button>
        <span class="brand">EduFlow</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="user-chip" id="user-chip"></span>
        <button type="button" class="btn btn-sm btn-outline-light" id="btn-logout">Logout</button>
      </div>
    </header>

    <main class="content" id="content"></main>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
